# Conda environment for D4RL PointMaze + flow BC + residual RL (SAC).
#
# Quick start (Linux + NVIDIA GPU):
#   conda env create -f environment.yml
#   conda activate d4rl
#
# Then install the DSRL SB3 fork (required, not on PyPI):
#   git clone git@github.com:Raymond112514/dsrl.git
#   cd dsrl/stable-baselines3
#   git checkout 18623d180404fa14780f167928c27fd205f4a526
#   pip install -e .
#
# Download the Minari PointMaze dataset:
#   python -c "import minari; minari.download_dataset('D4RL/pointmaze/large-dense-v2')"
#
# Optional system packages for MuJoCo rendering (Ubuntu/Debian):
#   sudo apt-get install -y libgl1 libglfw3 libglew2.2 libosmesa6
#
# Repo layout expected on the new machine:
#   d4rl/
#     flow/           # flow matching BC
#     residual_rl/    # residual SAC training
#   dsrl/
#     stable-baselines3/  # editable SB3 fork

name: d4rl
channels:
  - defaults
dependencies:
  - python=3.11.15
  - pip=26.1.1
  - openssl=3.5.6
  - zlib=1.3.1
  - pip:
      # PyTorch CUDA 12.4 wheels (match torch==2.6.0+cu124 on source machine)
      - --extra-index-url https://download.pytorch.org/whl/cu124
